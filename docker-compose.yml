# VERTICE services: the API (backend) and the worker that runs the daily tasks and the
# watcher. The frontend arrives in Phase 7 and Caddy (HTTPS + password) in Phase 9.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Secrets come from .env and are never baked into the image. The file is
    # optional: without keys the system starts and marks each source as not configured.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/vertice.db
    volumes:
      - ./config:/app/config:ro
      - vertice-data:/app/data
    # Reachable from this machine only. Nothing is public until Phase 9.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Scheduler and watcher: daily tasks, live prices, sell alerts and Telegram.
  # It shares the database with the backend and starts once that one has migrated it.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "scheduler"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/vertice.db
    volumes:
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - ./schemas:/app/schemas:ro
      - vertice-data:/app/data
      - vertice-runs:/app/runs
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vertice-data:
  vertice-runs:
