system:
  name: VERTICE
  mode: recommend            # recommend | watch_only | paused
  aggressiveness: 5          # 1..10 (sección 10)
  timezone_market: America/New_York
  timezone_user: America/Monterrey

capital:
  base_currency: USD
  cash_usd: 5000             # lo capturas tú y lo actualizas al depositar o retirar
  show_mxn: true
  fractional_shares: false

costs:
  commission_pct: 0.25       # pon la de tu casa de bolsa
  vat_on_commission_pct: 16
  slippage_pct: 0.05

universe:
  exchanges: [NYSE, NASDAQ]
  sic_only: false
  sic_list_path: config/sic_universe.csv
  min_price: 5
  min_dollar_volume_20d: 20000000
  min_market_cap: 1000000000
  exclude: [leveraged_etf, inverse_etf, spac, warrant, otc]

screener:
  top_n_to_controls: 25
  max_finalists: 10
  volatility_preference: 0.7   # 0..1; 1 = favorece las más volátiles
  atr_pct_sweet_spot: [2.5, 8.0]

regime:
  vix_bullish_max: 20
  vix_high_risk_min: 28
  vix_spike_5d_pct: 25         # una subida del VIX mayor a esto en 5 días es riesgo alto
  breadth_bullish_min: 55

plan:
  min_ideas_listed: 5
  publish_time_et: "09:00"
  recheck_time_et: "09:45"

entry:
  skip_first_minutes: 15
  order_type: limit

exits:
  target1_sell_pct: 50
  move_stop_to_breakeven_after_t1: true
  trailing_start_r: 1.5
  trailing_atr_mult: 2.5
  time_stop_days: 5
  time_stop_min_r: 0.5
  hold_through_earnings: false

controls:
  earnings_block_days: 3
  macro_event_block_hours: 6
  max_gap_atr: 2
  max_extension_atr: 3
  min_reward_r: 1.5
  max_sector_positions: 2
  max_sector_pct: 40
  max_correlation: 0.80
  cooldown_days_after_stop: 5
  daily_loss_stop_pct: 2
  weekly_loss_stop_pct: 5
  max_drawdown_pause_pct: 10

ai:
  enabled: true
  analyst_model: sonnet
  news_model: haiku
  lessons_model: sonnet
  daily_call_budget: 40
  reserve_for_positions_pct: 30
  max_usd_per_day: null      # solo si usas ANTHROPIC_API_KEY
  timeout_s: 180
  allow_web_search: false
  cache_minutes: 30

learning:
  min_cases: 20              # informativo: el mínimo real está en el CHECK de la base
  min_forward_cases: 10
  min_confidence: 0.60
  retire_below: 0.50
  max_active_lessons: 15
  max_new_per_day: 3

notify:
  telegram: true
  repeat_high_alerts_min: 5
  repeat_high_alerts_max: 3

data:
  rate_limit_utilization: 0.8   # usa como máximo el 80% del límite de cada proveedor
  max_retries: 4
  backoff_base_s: 1             # espera inicial entre reintentos; se duplica cada vez
  backoff_max_s: 60
  slow_ms: 3000                 # una respuesta más lenta que esto se marca como "lenta"
  raw_retention_days: 30
  stale:
    quote_max_age_s: 120        # en sesión, un precio más viejo que esto es "viejo"
    macro_max_age_trading_days: 3
  # limit_calls / limit_period_s = el límite PUBLICADO por el proveedor.
  # Si un proveedor lo cambia, cámbialo aquí. cache_ttl_s = segundos que se
  # reutiliza una respuesta, por tipo de dato.
  sources:
    alpaca:
      limit_calls: 200
      limit_period_s: 60
      timeout_s: 20
      critical: true
      cache_ttl_s: {daily_bars: 600, intraday_bars: 60, latest_quotes: 0, news: 120, assets: 86400, corporate_actions: 21600}
    finnhub:
      limit_calls: 60
      limit_period_s: 60
      timeout_s: 15
      critical: true
      cache_ttl_s: {company_news: 300, earnings_calendar: 3600, earnings_surprises: 21600, basic_financials: 86400, company_profile: 86400, insider_transactions: 21600}
    fred:
      limit_calls: 120
      limit_period_s: 60
      timeout_s: 15
      critical: true
      cache_ttl_s: {series_observations: 3600, release_dates: 43200}
    sec_edgar:
      limit_calls: 10
      limit_period_s: 1
      timeout_s: 15
      critical: false
      cache_ttl_s: {company_tickers: 86400, submissions: 1800}
    rss_news:               # sin límite publicado: 1 consulta por tema cada 15 min
      limit_calls: 30
      limit_period_s: 60
      timeout_s: 15
      critical: false
      cache_ttl_s: {google_news: 900, yahoo_finance: 900}
    massive:
      limit_calls: 5
      limit_period_s: 60
      timeout_s: 20
      critical: false
      cache_ttl_s: {daily_bars: 3600, grouped_daily: 3600}
    banxico:                # sin límite publicado: valor conservador
      limit_calls: 30
      limit_period_s: 60
      timeout_s: 15
      critical: false
      cache_ttl_s: {usd_mxn_fix: 3600}
    yahoo:                  # no oficial; solo respaldo del VIX intradía
      limit_calls: 10
      limit_period_s: 60
      timeout_s: 10
      critical: false
      max_retries: 1        # suele bloquear: no insistir
      cache_ttl_s: {chart: 600}
    telegram:
      limit_calls: 30
      limit_period_s: 1
      timeout_s: 10
      critical: false
  # Series de FRED: tasas 2 y 10 años, curva 10-2, fondos federales, spread
  # high-yield, dólar amplio, USD/MXN y VIX diario.
  fred_series: [DGS2, DGS10, T10Y2Y, DFF, BAMLH0A0HYM2, DTWEXBGS, DEXMXUS, VIXCLS]
  # Publicaciones de alto impacto; la fecha sale del calendario de FRED.
  econ_releases:
    - {name: CPI, fred_release_id: 10, time_et: "08:30", impact: high}
    - {name: Empleo, fred_release_id: 50, time_et: "08:30", impact: high}
    - {name: PIB, fred_release_id: 53, time_et: "08:30", impact: high}
  fomc_time_et: "14:00"

# Días de decisión del FOMC (segundo día de cada reunión), de federalreserve.gov.
# Las de 2027 son tentativas hasta que la Fed las confirme.
fomc_dates:
  - 2026-12-09
  - 2027-01-27
  - 2027-03-17
  - 2027-04-28
  - 2027-06-09
  - 2027-07-28
  - 2027-09-15
  - 2027-10-27
  - 2027-12-08
